name: CI/CD

# See _docs/deployment.md for the architecture this implements and
# _docs/release-process.md for how it's meant to be used day to day.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  APP_STACK_NAME: expense-splitter

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: .venv/bin/pytest -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  integration-and-e2e:
    name: Integration + e2e tests (docker compose)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the dev stack (postgres + backend + frontend)
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for the backend to be healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 5
          done
          echo "Backend never became healthy" >&2
          exit 1

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - name: Install backend dependencies (for integration tests)
        working-directory: backend
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Run integration tests (against the real Postgres container)
        run: backend/.venv/bin/pytest test/integration -q
        env:
          INTEGRATION_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests (against the running dev stack)
        working-directory: e2e
        run: npm test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Tear down the dev stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      id-token: write # required to mint the OIDC token
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC (no stored AWS keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up the running instance from the CloudFormation stack
        id: instance
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "$APP_STACK_NAME" --query 'Stacks[0].Outputs')
          INSTANCE_ID=$(jq -r '.[] | select(.OutputKey=="InstanceId") | .OutputValue' <<<"$OUTPUTS")
          PUBLIC_IP=$(jq -r '.[] | select(.OutputKey=="PublicIp") | .OutputValue' <<<"$OUTPUTS")
          if [ -z "$INSTANCE_ID" ] || [ -z "$PUBLIC_IP" ]; then
            echo "Could not read InstanceId/PublicIp from stack $APP_STACK_NAME outputs" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Deploy the new commit via SSM Run Command
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "expense-splitter deploy from ${{ github.sha }}" \
            --parameters 'commands=["set -e", "cd /opt/app", "git fetch --depth 1 origin master", "git reset --hard origin/master", "docker compose up -d --build"]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"; then
            echo "SSM command did not succeed — output below:" >&2
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.instance.outputs.instance_id }}" >&2
            exit 1
          fi

      - name: Validate the deploy by checking the health endpoint
        run: |
          URL="http://${{ steps.instance.outputs.public_ip }}:8000/healthz"
          for _ in $(seq 1 15); do
            if curl -sf "$URL"; then
              echo "" && echo "Healthy at $URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check at $URL failed after deploy" >&2
          exit 1
