openapi: 3.0.3
info:
  title: Expense Splitter API
  description: >
    Backend API for the Expense Splitter household ledger.
    Tracks members, one-off expenses split by fixed amounts, and pairwise
    settlements between household members.


    Authentication: **none**. Per the product spec ("no password — pick your
    identity for now"), the app has no login flow. Every endpoint below is
    unauthenticated and may be called by anyone with network access to the
    API. The "current person" the UI operates as is just a locally-selected
    member id passed as a path parameter or request field — it is an
    identity selection, not a credential, and the API does not verify it
    against any session.
  version: "1.0.0"

servers:
  - url: /api

tags:
  - name: members
  - name: expenses
  - name: settlements

paths:
  /members:
    get:
      tags: [members]
      summary: List household members
      description: >
        Returns every member of the household. Used to populate the identity
        switcher, payer/split pickers, and to resolve names shown elsewhere
        in the UI. No authentication required.
      operationId: listMembers
      security: []
      responses:
        "200":
          description: Members retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
              example:
                - id: m1
                  name: Iris Calloway
                  short: Iris
                  initials: IC
                - id: m2
                  name: Tobias Renn
                  short: Tobias
                  initials: TR

  /members/{personId}/balances:
    get:
      tags: [members]
      summary: Get one member's pairwise balances
      description: >
        Returns, for the given person, one row per other household member
        describing the net pairwise balance between them. A positive
        `amount` means the other person owes `personId`; a negative amount
        means `personId` owes the other person. Balances are derived from
        all expenses (splits) and settlements recorded so far and are never
        simplified across more than two people. No authentication required
        — `personId` is simply which member's ledger view to compute.
      operationId: getMemberBalances
      security: []
      parameters:
        - name: personId
          in: path
          required: true
          description: Id of the member to compute balances for.
          schema:
            type: string
          example: m1
      responses:
        "200":
          description: Pairwise balances for the given member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceRow"
              example:
                - person:
                    id: m2
                    name: Tobias Renn
                    short: Tobias
                    initials: TR
                  amount: 12.50
                - person:
                    id: m3
                    name: Maren Holt
                    short: Maren
                    initials: MH
                  amount: -8.00
        "404":
          description: No member exists with the given id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /expenses:
    get:
      tags: [expenses]
      summary: List all expenses
      description: >
        Returns every recorded expense, most recent date first. No
        authentication required.
      operationId: listExpenses
      security: []
      responses:
        "200":
          description: Expenses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
              example:
                - id: e1
                  title: Weekly groceries
                  payerId: m1
                  amount: 128.40
                  date: "2026-09-11"
                  splits:
                    - personId: m1
                      amount: 32.10
                    - personId: m2
                      amount: 32.10
                    - personId: m3
                      amount: 32.10
                    - personId: m4
                      amount: 32.10
    post:
      tags: [expenses]
      summary: Record a new expense
      description: >
        Creates a one-off expense paid by `payerId` and split into fixed
        per-person amounts. The expense's total `amount` is the sum of the
        (positive) split amounts — it is not sent by the client. Splits with
        a zero or missing amount are dropped. No authentication required;
        `payerId` and each split's `personId` are passed explicitly by the
        client.
      operationId: createExpense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
            example:
              title: Dinner at Olio
              payerId: m2
              date: "2026-09-09"
              splits:
                - personId: m1
                  amount: 38.00
                - personId: m2
                  amount: 24.00
                - personId: m4
                  amount: 34.00
      responses:
        "201":
          description: Expense created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: >
            Invalid request — missing/blank title, or no split has a
            positive amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: An expense needs a description and at least one share.

  /settlements:
    post:
      tags: [settlements]
      summary: Settle up a pair of members
      description: >
        Clears the entire outstanding balance between `fromId` and `toId` in
        one step (no partial settlements). The settled `amount` is computed
        server-side from the current pairwise balance between the two
        members, not supplied by the client. No authentication required;
        both members of the pair are passed explicitly by the client.
      operationId: createSettlement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementRequest"
            example:
              fromId: m3
              toId: m1
      responses:
        "201":
          description: Settlement recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
              example:
                id: s2
                fromId: m3
                toId: m1
                amount: 45.00
                date: "2026-09-14"
        "400":
          description: >
            Invalid request — `fromId` does not currently owe `toId`
            anything (nothing outstanding between this pair).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Nothing outstanding between these two.

components:
  schemas:
    Member:
      type: object
      required: [id, name, short, initials]
      properties:
        id:
          type: string
          description: Unique member id.
          example: m1
        name:
          type: string
          description: Full display name.
          example: Iris Calloway
        short:
          type: string
          description: Short display name used in compact UI.
          example: Iris
        initials:
          type: string
          description: Two-letter initials used for the avatar badge.
          example: IC

    Split:
      type: object
      required: [personId, amount]
      properties:
        personId:
          type: string
          description: Id of the member this share belongs to.
          example: m1
        amount:
          type: number
          format: double
          minimum: 0
          description: This person's fixed share of the expense, in currency units.
          example: 32.10

    Expense:
      type: object
      required: [id, title, payerId, amount, date, splits]
      properties:
        id:
          type: string
          example: e1
        title:
          type: string
          description: Free-text description of the expense.
          example: Weekly groceries
        payerId:
          type: string
          description: Id of the member who paid.
          example: m1
        amount:
          type: number
          format: double
          description: Total amount, equal to the sum of all split amounts.
          example: 128.40
        date:
          type: string
          format: date
          example: "2026-09-11"
        splits:
          type: array
          description: Per-person shares that make up the total.
          items:
            $ref: "#/components/schemas/Split"

    CreateExpenseRequest:
      type: object
      required: [title, payerId, splits]
      properties:
        title:
          type: string
          minLength: 1
          example: Dinner at Olio
        payerId:
          type: string
          example: m2
        date:
          type: string
          format: date
          description: Defaults to today's date (server time) if omitted.
          example: "2026-09-09"
        splits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Split"

    BalanceRow:
      type: object
      required: [person, amount]
      properties:
        person:
          $ref: "#/components/schemas/Member"
        amount:
          type: number
          format: double
          description: >
            Net balance between the requested member and `person`. Positive
            means `person` owes the requested member; negative means the
            requested member owes `person`; zero means settled up.
          example: 12.50

    Settlement:
      type: object
      required: [id, fromId, toId, amount, date]
      properties:
        id:
          type: string
          example: s1
        fromId:
          type: string
          description: Id of the member who paid off the debt.
          example: m3
        toId:
          type: string
          description: Id of the member who was owed and received payment.
          example: m1
        amount:
          type: number
          format: double
          description: Full outstanding amount that was cleared between the pair.
          example: 45.00
        date:
          type: string
          format: date
          example: "2026-09-06"

    CreateSettlementRequest:
      type: object
      required: [fromId, toId]
      properties:
        fromId:
          type: string
          description: Id of the member who is paying off their debt.
          example: m3
        toId:
          type: string
          description: Id of the member who is owed and being paid.
          example: m1

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Nothing outstanding between these two.
