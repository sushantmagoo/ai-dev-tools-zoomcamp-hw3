server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same trick as the Vite dev proxy: same-origin /api calls forwarded to
    # the backend container, so the frontend code never needs a backend URL.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
