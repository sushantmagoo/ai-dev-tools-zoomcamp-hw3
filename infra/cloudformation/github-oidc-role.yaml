AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap: an IAM role GitHub Actions can assume via OIDC (no
  long-lived AWS keys in GitHub) to deploy new app code to the already
  -provisioned expense-splitter EC2 instance (see ec2-stack.yaml) via SSM
  Run Command. This template does NOT create or modify the app
  infrastructure itself. See _docs/deployment.md for the full picture.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub account/org that owns the repo, e.g. "sushantmagoo".

  GitHubRepo:
    Type: String
    Description: Repo name (no owner prefix), e.g. "ai-dev-tools-zoomcamp-hw3".

  AllowedBranch:
    Type: String
    Default: master
    Description: Only a workflow run triggered by a push to this branch can assume the role.

  AppStackName:
    Type: String
    Default: expense-splitter
    Description: Name of the already-deployed ec2-stack.yaml stack this role is allowed to look up and deploy to.

  AppInstanceNameTag:
    Type: String
    Default: expense-splitter
    Description: The Name tag ec2-stack.yaml puts on its EC2 instance — used to scope ssm:SendCommand to just that instance.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to create the GitHub Actions OIDC provider in this account.
      An AWS account can only have one provider per URL — set this to
      'false' if token.actions.githubusercontent.com is already registered
      (e.g. from a previous project) and reuse that one.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Assumed by GitHub Actions in ${GitHubOrg}/${GitHubRepo} (branch ${AllowedBranch}) to deploy expense-splitter.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${AllowedBranch}
      Policies:
        - PolicyName: deploy-expense-splitter-via-ssm
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SendCommandToAppInstanceOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Ref AppInstanceNameTag
              - Sid: SendCommandUsingThisDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'
              - Sid: LookUpAppStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: LookUpInstance
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: >-
      Paste this into the GitHub repo as an Environment secret named
      AWS_DEPLOY_ROLE_ARN (Settings -> Environments -> production) — see
      _docs/deployment.md.
    Value: !GetAtt GitHubActionsDeployRole.Arn
